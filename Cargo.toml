[workspace]
members = [
    "aufc-wav",
    "odlt-ply",
    "otex-png",
    "otr-archive",
    "otr-common",
    "ovtx-ply",
    "seqex",
]
resolver = "3"

[workspace.dependencies]
clap = { version = "4.6" }
crc = { version = "3.4" }
ordered-float = { version = "5.5" }
png = { version = "0.18" }
serde = { version = "1.0" }
serde_json = { version = "1.0" }
from-to-repr = { version = "0.2" }
zip = { version = "9.0" }
